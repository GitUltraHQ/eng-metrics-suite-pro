services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Every repo's own comments/READMEs already call this "the shared
      # git_stats database" -- naming it explicitly instead of relying
      # on the image's auto-created default `postgres` database avoids
      # collisions/confusion on backup+restore (a differently-purposed
      # dump/restore workflow, or an existing Postgres server that
      # already has its own real `postgres` admin database).
      POSTGRES_DB: git_stats
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates/updates the shared schema, then exits -- sole
  # owner of git_stats' schema, see
  # gitultra-wiki/Specs/Migrations-Management.md. Every service below
  # that touches the database waits for this to complete successfully
  # before starting. restart: "no" is deliberate -- exiting 0 isn't a
  # crash to recover from, this isn't meant to be left running.
  migrate:
    image: ghcr.io/gitultrahq/gitultra-migrate:v1.5.0
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/git_stats}
    depends_on:
      postgres:
        condition: service_healthy

  # Continuous worker: claims queued repos and imports commit stats, then
  # polls for new work rather than exiting. Also periodically re-imports
  # already-'done' repos (every --resync-after-minutes, default 120) to
  # pick up new commits -- this is the only mechanism that keeps an
  # already-imported repo's data current, so this service being up is
  # load-bearing on an ongoing basis, not just for the initial import.
  # Each repo's clone is kept as a persistent local mirror under
  # git_mirrors (a Docker-managed volume, no host setup needed) and
  # updated via `git fetch` on every resync instead of a full re-clone.
  git-processor:
    image: ghcr.io/gitultrahq/git-processor:v1.0.1
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/git_stats}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME:-}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD:-}
      BITBUCKET_SERVER_USERNAME: ${BITBUCKET_SERVER_USERNAME:-}
      BITBUCKET_SERVER_TOKEN: ${BITBUCKET_SERVER_TOKEN:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Drop discover_repos.py's --config YAML (org/repo exclude patterns
      # etc.) here, e.g. /var/lib/eng-metrics-suite/discover_config.yaml.
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro
      - git_mirrors:/var/lib/git-processor/mirrors
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same idea as git-processor, but for PR/MR stats -- also runs
  # continuously and resyncs already-'done' repos periodically (same
  # --resync-after-minutes mechanism) to pick up new PR activity. No
  # mirror-cache equivalent needed here: vendor APIs are queried with an
  # incremental "since" filter directly, no local clone involved.
  pr-processor:
    image: ghcr.io/gitultrahq/pr-processor:v1.2.1
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/git_stats}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME:-}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD:-}
      BITBUCKET_SERVER_USERNAME: ${BITBUCKET_SERVER_USERNAME:-}
      BITBUCKET_SERVER_TOKEN: ${BITBUCKET_SERVER_TOKEN:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same idea as pr-processor, but imports incidents/tickets from Jira
  # (currently the only supported issue tracker -- see issue-processor's
  # README) for eng-reports'/eng-api's change-failure-rate/MTTR and
  # investment-allocation metrics. Optional: exits immediately (not a
  # continuous loop) if no JIRA_* vars are set at all; runs continuously
  # with the same periodic resync as git-processor/pr-processor once
  # configured.
  issue-processor:
    image: ghcr.io/gitultrahq/issue-processor:v1.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/git_stats}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_INCIDENT_ISSUE_TYPES: ${JIRA_INCIDENT_ISSUE_TYPES:-}
      JIRA_ALLOCATION_ISSUE_TYPES: ${JIRA_ALLOCATION_ISSUE_TYPES:-}
      JIRA_CATEGORY_FIELD: ${JIRA_CATEGORY_FIELD:-}
      JIRA_STORY_POINTS_FIELD: ${JIRA_STORY_POINTS_FIELD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Drop discover_jira_projects.py's --config YAML (project<->repo
      # map) and/or discover_allocation_projects.py's --config YAML
      # (project key list) here, e.g.
      # /var/lib/eng-metrics-suite/jira_project_map.yaml,
      # /var/lib/eng-metrics-suite/allocation_projects.yaml.
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Not a long-running service -- report.py always needs args (at minimum
  # --output), so this container isn't meant to be left running. See the
  # README for how to invoke it with `docker compose run`.
  eng-reports:
    image: ghcr.io/gitultrahq/eng-reports:v1.3.0
    entrypoint: ["python3"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/git_stats}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
      # Only needed if you use email_team_reports.py to email team
      # reports to managers -- see docs/scheduling.md. Your own SMTP
      # relay, never GitUltra's -- see
      # gitultra-wiki/Specs/Team-Reporting-Pseudonymization.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    depends_on:
      - postgres
    volumes:
      - ./reports:/out
      # Drop report.py's --team-map CSV here, e.g.
      # /var/lib/eng-metrics-suite/teams.csv.
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro

  # Paid-tier plugin (public GHCR package, gated by a signed license key
  # -- see this repo's README for setup). Long-running, unlike
  # eng-reports/rewrite-ratio, since it's a REST API a customer's own
  # dashboards poll.
  eng-api:
    image: ghcr.io/gitultrahq/eng-api:v1.5.0
    restart: unless-stopped
    ports:
      - "${ENG_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/git_stats}
      # Required, no default -- see eng-api's README's "Auth" section.
      # Set this to your own secret; it's never issued or stored by us.
      API_KEY: ${ENG_API_KEY:?set ENG_API_KEY in your .env}
      # Required, no default -- the license key you were issued; see
      # eng-api's README's "Distribution" section.
      GITULTRA_LICENSE_KEY: ${GITULTRA_LICENSE_KEY:?set GITULTRA_LICENSE_KEY in your .env}
      TEAM_MAP_PATH: ${ENG_API_TEAM_MAP_PATH:-}
      # Optional -- absent means the org-level roles feature (Admin/
      # Executive/Director) is off entirely, no behavior change. See
      # gitultra-wiki/Specs/Org-Role-Executive-Access.md. If you want
      # to use the admin-only live CSV-upload endpoints below (for
      # this or TEAM_MAP_PATH), point both env vars at a file under
      # the writable/ subdirectory in the volumes block below --
      # anywhere else under /var/lib/eng-metrics-suite is read-only to
      # this container.
      ORG_ROLES_PATH: ${ENG_API_ORG_ROLES_PATH:-}
      AI_COAUTHORS_PATH: ${ENG_API_AI_COAUTHORS_PATH:-}
      TAG_PATTERN: ${ENG_API_TAG_PATTERN:-}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
      # Only needed for the manager email-OTP flow (team-reporting
      # license product) -- see
      # gitultra-wiki/Specs/Team-Reporting-Pseudonymization.md. Your own
      # SMTP relay, never GitUltra's. Independent of eng-reports' own
      # SMTP_* vars below -- point both at the same relay or split them.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro
      # Read-write, unlike the mount above -- required only if you use
      # the admin-only POST /v1/admin/team-map or /v1/admin/org-roles
      # upload endpoints (live reload without a restart; see
      # gitultra-wiki/Specs/Org-Role-Executive-Access.md's Config
      # Management section). Scoped to a subdirectory rather than
      # widening the mount above, so every other config file eng-api
      # reads (discover-script YAMLs, KPI targets, etc.) stays
      # read-only. `sudo mkdir -p /var/lib/eng-metrics-suite/writable`
      # (and chown it appropriately) before using either upload
      # endpoint. Not required if you only ever hand-edit these CSVs
      # and restart -- that keeps working unchanged from wherever
      # TEAM_MAP_PATH/ORG_ROLES_PATH already point.
      - /var/lib/eng-metrics-suite/writable:/var/lib/eng-metrics-suite/writable:rw

  # MCP (Model Context Protocol) server: lets an AI agent (Claude
  # Desktop, Claude Code, etc.) query the metrics above conversationally,
  # by wrapping eng-api's REST endpoints as MCP tools. Pure HTTP-to-HTTP
  # proxy to eng-api -- no direct database access, no state of its own,
  # so no DATABASE_URL here. Streamable HTTP transport (not stdio), so
  # this is a long-running service like eng-api, not a locally-spawned
  # subprocess -- point your MCP client config at
  # http://<this-host>:${GITULTRA_MCP_PORT:-8100}/mcp (see gitultra-mcp's
  # own README for a sample Claude Desktop/Code config). Public GHCR
  # image, license-gated -- see gitultra-mcp's own README's
  # "Distribution" section.
  gitultra-mcp:
    image: ghcr.io/gitultrahq/gitultra-mcp:v1.2.0
    restart: unless-stopped
    ports:
      - "${GITULTRA_MCP_PORT:-8100}:8000"
    environment:
      ENG_API_BASE_URL: http://eng-api:8000
      # Same value as ENG_API_KEY above -- this server's own inbound
      # auth reuses eng-api's key rather than managing a second secret.
      ENG_API_KEY: ${ENG_API_KEY:?set ENG_API_KEY in your .env}
      # Required, no default -- your license key, covering the
      # "gitultra-mcp" product (can be the same key as eng-api's above
      # if it covers both products); see gitultra-mcp's README.
      GITULTRA_LICENSE_KEY: ${GITULTRA_LICENSE_KEY:?set GITULTRA_LICENSE_KEY in your .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - eng-api

volumes:
  pgdata:
  # git-processor's persistent per-repo mirror cache -- Docker-managed,
  # no manual setup needed (unlike /var/lib/eng-metrics-suite above,
  # which needs sudo mkdir/chown -- this one doesn't have that
  # constraint since it's only ever touched by git-processor's own
  # container, which runs as root).
  git_mirrors:
