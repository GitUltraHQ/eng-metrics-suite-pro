services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Continuous worker: claims queued repos and imports commit stats. Exits
  # cleanly (not a crash) whenever the queue is empty -- harmless to leave
  # running under `restart: unless-stopped` even before you've discovered
  # any repos yet.
  git-processor:
    image: ghcr.io/gitultrahq/git-processor:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME:-}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD:-}
      BITBUCKET_SERVER_USERNAME: ${BITBUCKET_SERVER_USERNAME:-}
      BITBUCKET_SERVER_TOKEN: ${BITBUCKET_SERVER_TOKEN:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      - postgres
    volumes:
      # Drop discover_repos.py's --config YAML (org/repo exclude patterns
      # etc.) here, e.g. /var/lib/eng-metrics-suite/discover_config.yaml.
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same idea as git-processor, but for PR/MR stats.
  pr-processor:
    image: ghcr.io/gitultrahq/pr-processor:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME:-}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD:-}
      BITBUCKET_SERVER_USERNAME: ${BITBUCKET_SERVER_USERNAME:-}
      BITBUCKET_SERVER_TOKEN: ${BITBUCKET_SERVER_TOKEN:-}
      AZURE_DEVOPS_PAT: ${AZURE_DEVOPS_PAT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same idea as pr-processor, but imports incidents from Jira (currently
  # the only supported issue tracker -- see issue-processor's README) for
  # eng-reports'/eng-api's change-failure-rate and MTTR metrics. Optional:
  # idles cleanly (same "empty queue -> clean exit -> restart" pattern as
  # git-processor/pr-processor above) if no JIRA_* vars are set yet.
  issue-processor:
    image: ghcr.io/gitultrahq/issue-processor:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_INCIDENT_ISSUE_TYPES: ${JIRA_INCIDENT_ISSUE_TYPES:-}
      JIRA_ALLOCATION_ISSUE_TYPES: ${JIRA_ALLOCATION_ISSUE_TYPES:-}
      JIRA_CATEGORY_FIELD: ${JIRA_CATEGORY_FIELD:-}
      JIRA_STORY_POINTS_FIELD: ${JIRA_STORY_POINTS_FIELD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      - postgres
    volumes:
      # Drop discover_jira_projects.py's --config YAML (project<->repo
      # map) and/or discover_allocation_projects.py's --config YAML
      # (project key list) here, e.g.
      # /var/lib/eng-metrics-suite/jira_project_map.yaml,
      # /var/lib/eng-metrics-suite/allocation_projects.yaml.
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Not a long-running service -- report.py always needs args (at minimum
  # --output), so this container isn't meant to be left running. See the
  # README for how to invoke it with `docker compose run`.
  eng-reports:
    image: ghcr.io/gitultrahq/eng-reports:latest
    entrypoint: ["python3"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      - postgres
    volumes:
      - ./reports:/out
      # Drop report.py's --team-map CSV here, e.g.
      # /var/lib/eng-metrics-suite/teams.csv.
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro

  # Paid-tier plugin (public GHCR package, gated by a signed license key
  # -- see this repo's README for setup). Long-running, unlike
  # eng-reports/rewrite-ratio, since it's a REST API a customer's own
  # dashboards poll.
  eng-api:
    image: ghcr.io/gitultrahq/eng-api:latest
    restart: unless-stopped
    ports:
      - "${ENG_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/postgres
      # Required, no default -- see eng-api's README's "Auth" section.
      # Set this to your own secret; it's never issued or stored by us.
      API_KEY: ${ENG_API_KEY:?set ENG_API_KEY in your .env}
      # Required, no default -- the license key you were issued; see
      # eng-api's README's "Distribution" section.
      GITULTRA_LICENSE_KEY: ${GITULTRA_LICENSE_KEY:?set GITULTRA_LICENSE_KEY in your .env}
      TEAM_MAP_PATH: ${ENG_API_TEAM_MAP_PATH:-}
      AI_COAUTHORS_PATH: ${ENG_API_AI_COAUTHORS_PATH:-}
      TAG_PATTERN: ${ENG_API_TAG_PATTERN:-}
      TELEMETRY_DISABLED: ${TELEMETRY_DISABLED:-}
      TELEMETRY_SHARED_SECRET: ${TELEMETRY_SHARED_SECRET:-}
    depends_on:
      - postgres
    volumes:
      - /var/lib/eng-metrics-suite:/var/lib/eng-metrics-suite:ro

  # MCP (Model Context Protocol) server: lets an AI agent (Claude
  # Desktop, Claude Code, etc.) query the metrics above conversationally,
  # by wrapping eng-api's REST endpoints as MCP tools. Pure HTTP-to-HTTP
  # proxy to eng-api -- no direct database access, no state of its own,
  # so no DATABASE_URL here. Streamable HTTP transport (not stdio), so
  # this is a long-running service like eng-api, not a locally-spawned
  # subprocess -- point your MCP client config at
  # http://<this-host>:${GITULTRA_MCP_PORT:-8100}/mcp (see gitultra-mcp's
  # own README for a sample Claude Desktop/Code config). Currently a
  # PRIVATE GHCR image (contact support@gitultra.com for pull access) --
  # see gitultra-mcp's own README's "Distribution" section.
  gitultra-mcp:
    image: ghcr.io/gitultrahq/gitultra-mcp:latest
    restart: unless-stopped
    ports:
      - "${GITULTRA_MCP_PORT:-8100}:8000"
    environment:
      ENG_API_BASE_URL: http://eng-api:8000
      # Same value as ENG_API_KEY above -- this server's own inbound
      # auth reuses eng-api's key rather than managing a second secret.
      ENG_API_KEY: ${ENG_API_KEY:?set ENG_API_KEY in your .env}
      # Required, no default -- your license key, covering the
      # "gitultra-mcp" product (can be the same key as eng-api's above
      # if it covers both products); see gitultra-mcp's README.
      GITULTRA_LICENSE_KEY: ${GITULTRA_LICENSE_KEY:?set GITULTRA_LICENSE_KEY in your .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - eng-api

volumes:
  pgdata:
